<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="100%" height="338">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .heading { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .body { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #0f172a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #0f172a; }
      .monoDim { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #64748b; }
      .box { stroke-width: 1.5; rx: 6; }
      .box-in { fill: #eff6ff; stroke: #3b82f6; }
      .box-patch { fill: #f5f3ff; stroke: #8b5cf6; }
      .box-nav { fill: #ecfdf5; stroke: #10b981; }
      .box-sel { fill: #fff7ed; stroke: #f59e0b; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5; stroke-linecap: round; fill: none; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
    </marker>
  </defs>

  <text x="20" y="22" class="heading">What a left mouse-down does</text>

  <rect x="20" y="36" width="170" height="46" class="box box-in" />
  <text x="32" y="55" class="body">mouse-down on a label</text>
  <text x="32" y="72" class="monoDim">renderable.selectable ?</text>

  <path d="M190 52 L270 40" class="arrow" marker-end="url(#ah)" />
  <text x="212" y="38" class="label">true</text>
  <path d="M190 66 L270 80" class="arrow" marker-end="url(#ah)" />
  <text x="212" y="88" class="label">false</text>

  <rect x="278" y="18" width="200" height="42" class="box box-sel" />
  <text x="290" y="36" class="body">drag-selection starts</text>
  <text x="290" y="52" class="label">the click never lands</text>

  <rect x="278" y="68" width="200" height="42" class="box box-nav" />
  <text x="290" y="86" class="body">the click handler runs</text>
  <text x="290" y="102" class="label">navigation works</text>

  <text x="20" y="156" class="heading">Where that flag comes from</text>

  <rect x="20" y="168" width="180" height="146" class="box box-in" />
  <text x="32" y="187" class="label">upstream constructor</text>
  <text x="32" y="206" class="mono">selectable =</text>
  <text x="32" y="220" class="mono">  options.selectable</text>
  <text x="32" y="234" class="mono">  ?? _defaultOptions</text>
  <text x="32" y="260" class="label">text, code, markdown,</text>
  <text x="32" y="276" class="label">input, textarea and</text>
  <text x="32" y="292" class="label">ascii-font ship true</text>

  <line x1="200" y1="241" x2="240" y2="241" class="arrow" marker-end="url(#ah)" />

  <rect x="248" y="168" width="196" height="146" class="box box-patch" />
  <text x="260" y="187" class="label">catalogue subclass</text>
  <text x="260" y="206" class="mono">options.selectable</text>
  <text x="260" y="220" class="mono">  === undefined</text>
  <text x="260" y="234" class="mono">&amp;&amp; this.selectable</text>
  <text x="260" y="248" class="mono">  === true</text>
  <text x="260" y="262" class="mono">→ selectable = false</text>
  <text x="260" y="286" class="label">a prop the caller gave</text>
  <text x="260" y="300" class="label">passes straight through</text>

  <line x1="444" y1="241" x2="484" y2="241" class="arrow" marker-end="url(#ah)" />

  <rect x="492" y="168" width="128" height="146" class="box box-nav" />
  <text x="504" y="190" class="mono">&lt;text&gt;</text>
  <text x="504" y="205" class="label">false — navigates</text>
  <text x="504" y="233" class="mono">&lt;text selectable&gt;</text>
  <text x="504" y="248" class="label">true — selects</text>
  <text x="504" y="276" class="mono">&lt;box&gt;</text>
  <text x="504" y="291" class="label">false, untouched</text>
</svg>
