<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="160">
  <defs>
    <style>
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .track { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4 4; }
      .event { fill: #3b82f6; }
      .execution { fill: #10b981; }
      .span { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 4; }
    </style>
  </defs>
  <text x="20" y="24" class="title">Debounce Execution Timeline</text>
  <line x1="20" y1="60" x2="560" y2="60" class="track" />
  <circle cx="80" cy="60" r="8" class="event" />
  <circle cx="120" cy="60" r="8" class="event" />
  <circle cx="170" cy="60" r="8" class="event" />
  <rect x="170" y="48" width="160" height="24" class="span" />
  <text x="210" y="64" class="label">delayMs window</text>
  <line x1="20" y1="120" x2="560" y2="120" class="track" />
  <circle cx="330" cy="120" r="9" class="execution" />
  <text x="350" y="125" class="title">Invoked (trailing edge)</text>
  <text x="20" y="86" class="label">Raw events (burst)</text>
  <text x="20" y="146" class="label">Debounced output</text>
</svg>
